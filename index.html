<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyon Prints </title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-body: #e2f4ff;       
            --bg-card: #95d8ff;       
            --primary: #caebff;       
            --primary-hover: #115c88; 
            --text-dark: #001047;     
            --text-light: #4bc6e8;    
            --white: #FFFFFF;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            background-image: radial-gradient(#D4DFFF 5px);
            background-size: 20px 20px;
}
        }
        .container {
          width: 90% !important;
          max-width: 450px !important;
          margin-left: auto !important;
          margin-right: auto !important;
          margin-left: auto;
          margin-right: auto;
          padding: 40px 20px;
          box-sizing: border-box;
       }
        /* --- NAVIGATION SYSTEM --- */
        .page { display: none; }
        .page.active { display: block; }
        /* --- LANDING PAGE STYLES --- */
        .profile-area { text-align: center; margin-bottom: 40px; }
        .avatar { 
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            background: var(--bg-card); 
            border: 4px solid var(--white); 
            margin: 0 auto 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }
        .avatar-placeholder {
            font-size: 30px;
        }
        .nav-button {
           display: block;
           width: 80%;
           max-width: 450px; /* Membatasi lebar maksimal agar ramping di laptop */
           background: var(--bg-card);
           color: var(--text-dark);
           text-decoration: none;
           text-align: center;
           padding: 18px;
           margin: 0 auto 15px auto; /* Membuat tombol otomatis berada di tengah */
           border-radius: 15px;
           font-weight: bold;
           transition: 0.3s;
           border: 2px solid transparent;
           cursor: pointer;
           box-sizing: border-box;
        }
        .nav-button:hover {
            background: var(--primary);
            transform: translateY(-3px);
            border-color: var(--white);
        }
        
    </style>
</head>
<body>

<div class="container">
    <div id="pageLanding" class="page active">
        <div class="profile-area">
            <div class="avatar">
                <img src="profile.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span class="avatar-placeholder" style="display:none;">🐰</span>
            </div>
            <h2 style="color: var(--primary-hover); margin-bottom: 5px;">Pyon Prints 🐰</h2>
            <p style="color: var(--text-light); font-size: 0.9em; margin-top: 0; letter-spacing: 0.3px;">The Print Shop Ever!</p>
        </div>
        <a href="https://shopee.co.id/souffales" target="_blank" class="nav-button">🍊 Shopee</a>
        <a href="https://tk.tokopedia.com/ZSsM7Ujxm/" target="_blank" class="nav-button">🍏 Tokopedia</a>
        <a href="https://vt.tiktok.com/ZSsMWTeqj/?page=Mall" target="_blank" class="nav-button">🎵 Tiktok Shop</a>
        <a href="https://instagram.com/pyon_prints" target="_blank" class="nav-button">🎀 Instagram</a>
        <a href="https://x.com/pyonprints" target="_blank" class="nav-button">💙 Twitter</a>
        <a href="https://www.tiktok.com/@pyonprints?_r=1&_t=ZS-9BiWIvO3e6i" target="_blank" class="nav-button">🎶 Tiktok</a>
    </div>

</script>

</body>
</html>
